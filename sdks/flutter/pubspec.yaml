name: tracki_flutter
description: >-
  Tracki behavioral-intelligence mobile SDK (Dart port of @tracki/mobile-core).
  Pure-Dart core implementing docs/mobile-wire-protocol.md; conformance-tested
  against sdks/conformance/. Source-complete, not yet compile-verified in CI.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

# Core is dependency-free pure Dart so `dart test` runs the conformance suite
# without a Flutter toolchain. A host app supplies storage via FunctionStorage
# (e.g. backed by shared_preferences) — no Flutter dep is forced here.
dependencies: {}

dev_dependencies:
  test: ^1.24.0
